# =============================================================================
# conf.ini - central configuration for the NEETprep web test framework
#
# Read with:  configReader.readConfig("<section>", "<key>")
#
# [common info] -> URLs and test inputs used by step definitions
# [playwright]  -> timeouts applied to every page (conftest.py)
# [locators]    -> element selectors used by the Page Objects (BasePage)
#
# Locator key naming: <name>_<TYPE>, TYPE decides how BasePage builds the locator:
#   _XPATH    -> XPath            e.g. //button[@id='otp_button']
#   _ID       -> element id       e.g. number
#   _CSS      -> CSS selector     e.g. body > div > span
#   _NAME     -> name attribute
#   _LINKTEXT -> exact link text
#
# When the website UI changes, update the selector here - no code change needed.
# Comments must be on their own line (an inline "# ..." becomes part of the value).
# =============================================================================

[common info]
# Main site, shop site and the product searched in the shop test
url = https://www.neetprep.com
shop_url = https://shop.neetprep.com
product_name = HYTS HOME TEST SERIES LATEST EDITION

[playwright]
# Central timeouts (milliseconds) applied to every page in conftest.py
